name: Analyze ELF library

on:
  workflow_dispatch:
    inputs:
      binary_path:
        description: "Path to the .so file in the repository"
        required: true
        default: "input/libGamerKillshot.so"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file binutils unzip wget jq
          sudo apt-get install -y openjdk-21-jdk
          java -version

      - name: Download latest official Ghidra release
        shell: bash
        run: |
          set -euo pipefail
          API_JSON="$(curl -fsSL https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest)"
          GHIDRA_URL="$(printf '%s' "$API_JSON" | jq -r '.assets[] | select(.name | test("^ghidra_.*PUBLIC.*\\.zip$")) | .browser_download_url' | head -n 1)"
          if [ -z "$GHIDRA_URL" ] || [ "$GHIDRA_URL" = "null" ]; then
            echo "Could not find the official Ghidra ZIP in the latest release."
            exit 1
          fi
          echo "Downloading: $GHIDRA_URL"
          wget -q --show-progress "$GHIDRA_URL" -O /tmp/ghidra.zip
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q /tmp/ghidra.zip -d "$RUNNER_TEMP/ghidra"
          GHIDRA_DIR="$(find "$RUNNER_TEMP/ghidra" -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' | head -n 1)"
          test -n "$GHIDRA_DIR"
          echo "GHIDRA_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"

      - name: Validate input library
        shell: bash
        env:
          BINARY_PATH: ${{ inputs.binary_path }}
        run: |
          set -euo pipefail
          if [ ! -f "$BINARY_PATH" ]; then
            echo "Input file not found: $BINARY_PATH"
            echo "Upload your .so into the repository, then rerun this workflow."
            exit 1
          fi
          mkdir -p results
          file "$BINARY_PATH" | tee results/file-info.txt
          sha256sum "$BINARY_PATH" | tee results/sha256.txt
          readelf -h "$BINARY_PATH" > results/elf-header.txt
          readelf -l "$BINARY_PATH" > results/program-headers.txt
          readelf -S "$BINARY_PATH" > results/sections.txt
          readelf -Ws "$BINARY_PATH" > results/symbols.txt
          readelf -d "$BINARY_PATH" > results/dynamic-section.txt || true
          readelf -r "$BINARY_PATH" > results/relocations.txt || true
          nm -D --demangle "$BINARY_PATH" > results/dynamic-symbols.txt 2>&1 || true
          strings -a -n 4 "$BINARY_PATH" > results/strings.txt
          cp "$BINARY_PATH" results/input-library.so

      - name: Run Ghidra headless analysis and export pseudocode
        shell: bash
        env:
          BINARY_PATH: ${{ inputs.binary_path }}
        run: |
          set -euo pipefail
          mkdir -p results/ghidra-project results/decompiled
          "$GHIDRA_DIR/support/analyzeHeadless" \
            results/ghidra-project GamerKillshotAnalysis \
            -import "$BINARY_PATH" \
            -overwrite \
            -analysisTimeoutPerFile 3600 \
            -scriptPath "$GITHUB_WORKSPACE/scripts" \
            -postScript ExportDecompilation.java "$GITHUB_WORKSPACE/results/decompiled" \
            -log "$GITHUB_WORKSPACE/results/ghidra.log" \
            -scriptlog "$GITHUB_WORKSPACE/results/ghidra-script.log"

      - name: Create function and report index
        if: always()
        run: |
          mkdir -p results
          {
            echo "# Analysis report"
            echo
            echo "- Input: \`${{ inputs.binary_path }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo
            echo "## Files"
            find results -type f ! -name 'report-index.md' -printf '- `%p` (%s bytes)\n' | sort
          } > results/report-index.md
          cd results
          zip -qr ../GamerKillshot-analysis.zip .
          cd ..

      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GamerKillshot-analysis
          path: GamerKillshot-analysis.zip
          if-no-files-found: warn
          retention-days: 7
